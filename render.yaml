# Render Blueprint Specification for Mythos: Multiplayer Adventure Gaming Platform
# Deploy directly at https://dashboard.render.com/blueprints

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Gaming Engine & WebSocket Backend Service
  # ---------------------------------------------------------------------------
  - type: web
    name: mythos-backend
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
        # Example format: postgresql://<USER>:<PASSWORD>@<HOST>/<DBNAME>?sslmode=require
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: API_PREFIX
        value: /api
      - key: DEBUG
        value: "false"
      - key: Allowed_origins
        value: "*"

  # ---------------------------------------------------------------------------
  # 2. React + Vite Dark Gaming UI Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: mythos-frontend
    runtime: static
    plan: free
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mythos-backend
          property: host
        # Forms: https://mythos-backend.onrender.com/api
      - key: VITE_WS_BASE_URL
        fromService:
          type: web
          name: mythos-backend
          property: host
